[package]
name = "resman-cli"
version = "0.17.12"
edition = "2024"
rust-version = "1.85"
description = "Local-first experiment tracker for autonomous AI training agents"
license = "MIT"
readme = "README.md"
repository = "https://github.com/hanmahong5-arch/lurus-autoresearch"
keywords = ["ml", "experiment-tracking", "ai-agents", "cli", "training"]
categories = ["command-line-utilities", "science"]
# design/ is an internal HTML component-preview library (DesignSync source); it
# is not compiled or referenced by the build, so keep it out of the published crate.
exclude = ["design/**"]

[[bin]]
name = "resman"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
glob = "0.3"
regex = "1"
thiserror = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
proptest = "1"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
